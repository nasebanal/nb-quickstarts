# Single-binary Loki with local filesystem storage - fine for a local
# quickstart, not a production layout. Logs arrive over Loki's native OTLP
# endpoint (/otlp), which is why structured metadata must be allowed: OTLP
# attributes (severity, trace_id, span_id, ...) are stored as structured
# metadata rather than indexed labels.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  retention_period: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
