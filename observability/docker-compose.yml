services:
  # Single OTLP entry point. Apps (and any gateway with OTel support) export
  # here; it fans traces out to Tempo and exposes metrics in Prometheus
  # format for Prometheus to scrape. Swapping the backend later (e.g. to
  # NewRelic, which also ingests OTLP) is a change to otel-collector.yaml
  # only - the apps' instrumentation stays the same.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_VERSION:-0.116.1}
    container_name: nb-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    depends_on:
      - tempo
      - loki
    networks:
      - observability-net
      - apps-network

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.1.0}
    container_name: nb-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9094}:9090"
    networks:
      - observability-net
      # Also on apps-network so prometheus.yml can scrape modules' own
      # /metrics endpoints (Kong, ...) by container name.
      - apps-network

  tempo:
    image: grafana/tempo:${TEMPO_VERSION:-2.7.1}
    container_name: nb-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    # Named volumes are created root-owned but Tempo runs as a non-root
    # user, so it couldn't write /var/tempo without this.
    user: root
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"
    networks:
      - observability-net

  # Application logs. Receives OTLP logs from the collector on its native
  # /otlp endpoint; Grafana queries it (LogQL) alongside metrics and traces.
  loki:
    image: grafana/loki:${LOKI_VERSION:-3.3.2}
    container_name: nb-loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    # Same reason as tempo above: root-owned named volume, non-root process.
    user: root
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      - observability-net

  # Receives alerts from Prometheus (alert-rules.yml), groups/dedupes them and
  # routes them to a receiver (alertmanager.yml).
  alertmanager:
    image: prom/alertmanager:${ALERTMANAGER_VERSION:-v0.28.0}
    container_name: nb-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      # 9095, not Alertmanager's own 9093 default - 9093 is Kafka's
      # controller port on the host.
      - "${ALERTMANAGER_PORT:-9095}:9093"
    depends_on:
      - alert-sink
    networks:
      - observability-net

  # Webhook receiver standing in for Slack/email/etc. Prints each alert it
  # is sent; see bin/alert_sink.py.
  alert-sink:
    image: python:3.13-alpine
    container_name: nb-alert-sink
    command: ["python", "-u", "/app/alert_sink.py"]
    volumes:
      - ./bin/alert_sink.py:/app/alert_sink.py:ro
    networks:
      - observability-net

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-11.4.0}
    container_name: nb-grafana
    environment:
      # Local-only quickstart: anonymous access as Admin, no login screen.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # 3030, not Grafana's own 3000 default - 3000 is a very common
      # Node/React dev-server port on the host (same reasoning as
      # agentgateway's AGENTGATEWAY_PORT).
      - "${GRAFANA_PORT:-3030}:3000"
    depends_on:
      - prometheus
      - tempo
      - loki
      - alertmanager
    networks:
      - observability-net

networks:
  observability-net:
    name: observability-net
  # Owned by apps/docker-compose.yml; see AGENTS.md "Cross-module Docker network".
  apps-network:
    name: apps-network
    external: true

volumes:
  prometheus-data:
  tempo-data:
  loki-data:
  alertmanager-data:
  grafana-data:
