services:
  # Provider test: does the running backend honor the contract?
  # The contract and its examples live in shared/openapi/ (checked in,
  # mounted read-only) - read straight from there, never fetched from the
  # backend, so what the backend is verified against can't be whatever the
  # backend happens to say about itself.
  specmatic:
    image: specmatic/specmatic:${SPECMATIC_VERSION:-2.55.1}
    working_dir: /app
    volumes:
      # Specmatic always writes its HTML report to build/reports/specmatic/test/html
      # under the working dir, with no flag to redirect it - so mount that
      # subtree straight onto the host instead.
      - ./report:/app/build/reports/specmatic
      - ./junit:/app/junit
      - ../shared:/shared:ro
    command:
      - test
      - /shared/openapi/openapi.yaml
      - --host=backend
      - --port=8080
      - --examples=/shared/openapi/examples
      - --junitReportDir=/app/junit
    networks:
      - apps-network

  # A mock server built from the same contract (schema + examples) that
  # specmatic:test verifies the real backend against - so apps/frontend can
  # be tested as a Consumer against the *contract*, independent of whatever
  # the real backend happens to be doing right now, and without the backend
  # running at all. Requests that match one of the examples get that
  # example's exact response; anything else gets a schema-valid response
  # with randomly generated values - which is actually a stronger check for
  # a consumer than always seeing the same realistic-looking values, since
  # it can't accidentally pass by relying on one specific example's data.
  specmatic-mock:
    image: specmatic/specmatic:${SPECMATIC_VERSION:-2.55.1}
    container_name: nb-specmatic-mock
    working_dir: /app
    volumes:
      - ../shared:/shared:ro
    ports:
      - "${SPECMATIC_MOCK_PORT:-9091}:9091"
    command:
      - mock
      - /shared/openapi/openapi.yaml
      - --host=0.0.0.0
      - --port=9091
      - --examples=/shared/openapi/examples
    networks:
      - apps-network

networks:
  # Owned by apps/docker-compose.yml; see AGENTS.md "Cross-module Docker network".
  apps-network:
    name: apps-network
    external: true
