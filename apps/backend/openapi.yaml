# The contract. This file is the source of truth for apps/backend's REST
# API - authored and versioned by hand, not generated from the FastAPI
# route code. apps/backend loads this file at startup and serves it
# verbatim at GET /openapi.json (see app/main.py) instead of letting
# FastAPI derive a schema from its own routes.
#
# This is a deliberate reversal of this repo's earlier "no checked-in
# schema, always live-generated" stance: a schema generated FROM the
# implementation can never structurally disagree with it, so a provider
# verification test (Specmatic) run against it can only ever catch
# behavioral bugs, not real contract drift. With a physically separate,
# hand-maintained contract, "does the implementation still honor this
# file" becomes a real, failable question - which is the whole point of
# Contract-Driven Development. Consumers (apps/frontend, kafka-bridge,
# Specmatic's stub for consumer-side testing) and the Provider
# (apps/backend) both build against this one file independently.
#
# GraphQL (/graphql) is deliberately not described here - it's a separate
# protocol with its own schema (introspectable at /graphql itself), and
# OpenAPI can't describe its request shape ({query, variables}) in any
# meaningful way. See AGENTS.md's Specmatic section for the full reasoning.
#
# Keep this in sync by hand whenever app/routers/*.py or app/schemas.py
# change - that's the tradeoff for the contract actually meaning something.
openapi: 3.0.3
info:
  title: nb-quickstarts apps backend
  description: >-
    テスト対象アプリのバックエンドAPI(accounts
    リソースの最小限のイベントソーシング実装)。この契約(openapi.yaml)がソース・オブ・トゥルースで、実装側がこれに従う。
  version: 0.1.0
paths:
  /health:
    get:
      tags: [health]
      summary: Health
      operationId: health_health_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                healthy:
                  value:
                    status: ok
  /auth/login:
    post:
      tags: [auth]
      summary: Login
      operationId: login_auth_login_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              # Named to match the response example below - Microcks pairs
              # request/response examples by matching key, not by content
              # (see AGENTS.md's Microcks section).
              e001_login:
                summary: Log in as employee E001
                value:
                  employeeCode: E001
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              examples:
                e001_login:
                  value:
                    token: example-token-abc123
                    employeeCode: E001
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /accounts:
    get:
      tags: [accounts]
      summary: List Accounts
      operationId: list_accounts_accounts_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                title: Response List Accounts Accounts Get
                items:
                  $ref: "#/components/schemas/AccountOut"
              examples:
                seeded_accounts:
                  value:
                    - id: 1
                      name: Cash
                      quantity: 100000
                      source: seed
                      createdAt: "2024-01-01T00:00:00"
                    - id: 2
                      name: Rent Expense
                      quantity: 30000
                      source: seed
                      createdAt: "2024-01-01T00:00:00"
    post:
      tags: [accounts]
      summary: Create Account
      operationId: create_account_accounts_post
      # Deliberately no requestBody/response `examples:` here, unlike every
      # other operation - this one needs a real bearer token (see auth.py),
      # which an OpenAPI example has no way to carry (it's a header, not
      # part of the body). specmatic:test already covers this operation via
      # its own dynamically-generated externalized example, with a real
      # token fetched at test time (see specmatic/bin/prepare_contract.sh);
      # an inline example here would give Specmatic a second, competing
      # scenario for the same operation with no way to authenticate it,
      # always failing with 401. Microcks can't mock this one as a result -
      # see README's Microcks section for why that's an accepted scope
      # boundary, not an oversight.
      security:
        - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreate"
      responses:
        "201":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountOut"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"
              examples:
                unauthorized:
                  value:
                    detail: invalid or missing token
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /accounts/balances:
    get:
      tags: [accounts]
      summary: List Balances
      operationId: list_balances_accounts_balances_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                title: Response List Balances Accounts Balances Get
                items:
                  $ref: "#/components/schemas/AccountBalance"
              examples:
                seeded_balances:
                  value:
                    - name: Cash
                      balance: 120000
                      eventCount: 3
                    - name: Rent Expense
                      balance: 30000
                      eventCount: 1
                    - name: Sales Revenue
                      balance: 50000
                      eventCount: 1
  /accounts/{account_id}:
    get:
      tags: [accounts]
      summary: Get Account
      operationId: get_account_accounts__account_id__get
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: integer
            title: Account Id
          examples:
            cash_account:
              summary: The seed data's first row - always present
              value: 1
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountOut"
              examples:
                cash_account:
                  value:
                    id: 1
                    name: Cash
                    quantity: 100000
                    source: seed
                    createdAt: "2024-01-01T00:00:00"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"
              examples:
                not_found:
                  value:
                    detail: account not found
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
components:
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
  schemas:
    AccountBalance:
      type: object
      title: AccountBalance
      description: >-
        A name's current balance: the sum of every event's `quantity` for
        that name, plus how many events contributed to it (see
        `account_service.get_balances`).
      required: [name, balance, eventCount]
      properties:
        name:
          type: string
          title: Name
        balance:
          type: integer
          title: Balance
        eventCount:
          type: integer
          title: Eventcount
    AccountCreate:
      type: object
      title: AccountCreate
      description: >-
        `quantity` is a signed delta (e.g. -3 to record consumption), not an
        absolute value - see `Account` in models.py.
      required: [name]
      properties:
        name:
          type: string
          title: Name
        quantity:
          type: integer
          title: Quantity
          default: 0
    AccountOut:
      type: object
      title: AccountOut
      required: [id, name, quantity, source, createdAt]
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        quantity:
          type: integer
          title: Quantity
        source:
          type: string
          title: Source
        createdAt:
          type: string
          format: date-time
          title: Createdat
    HealthResponse:
      type: object
      title: HealthResponse
      required: [status]
      properties:
        status:
          type: string
          title: Status
    LoginRequest:
      type: object
      title: LoginRequest
      required: [employeeCode]
      properties:
        employeeCode:
          type: string
          title: Employeecode
    LoginResponse:
      type: object
      title: LoginResponse
      required: [token, employeeCode]
      properties:
        token:
          type: string
          title: Token
        employeeCode:
          type: string
          title: Employeecode
    HTTPError:
      type: object
      title: HTTPError
      description: FastAPI's default error body shape - HTTPException(detail=...).
      required: [detail]
      properties:
        detail:
          type: string
          title: Detail
    HTTPValidationError:
      type: object
      title: HTTPValidationError
      properties:
        detail:
          type: array
          title: Detail
          items:
            $ref: "#/components/schemas/ValidationError"
    ValidationError:
      type: object
      title: ValidationError
      required: [loc, msg, type]
      properties:
        loc:
          type: array
          title: Location
          items:
            anyOf:
              - type: string
              - type: integer
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
