services:
  mysql-server:
    image: mysql:${APPS_MYSQL_VERSION:-8.4.7}
    container_name: nb-mysql-server
    ports:
      - "${APPS_MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${APPS_MYSQL_ROOT_PASSWORD:-rootpassword}
      # The database and the application login the container creates on first
      # start (an existing data volume keeps whatever it was created with - see
      # `make apps:reset`). Locust's MySQL scenario and the Vault module use the
      # same APPS_MYSQL_* values.
      MYSQL_DATABASE: ${APPS_MYSQL_DATABASE:-demo}
      MYSQL_USER: ${APPS_MYSQL_USER:-demo}
      MYSQL_PASSWORD: ${APPS_MYSQL_PASSWORD:-demo}
    healthcheck:
      # TCP(127.0.0.1) で mysqld が接続を受け付けられるまでを ready とみなす
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${APPS_MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
    networks:
      - apps-network
    volumes:
      - apps-db-data:/var/lib/mysql

  # A SQL client, already logged in to the database: open
  # http://localhost:8081 and the tables (accounts, users) are right there.
  # phpMyAdmin skips its login screen when PMA_USER/PMA_PASSWORD are set. It
  # connects as root on purpose - so it can also show `mysql.user`, where the
  # users Vault creates in the Vault scenario appear. Local demo only: a root
  # login with no prompt is exactly what you would never expose anywhere else.
  sql-client:
    image: phpmyadmin:${PHPMYADMIN_VERSION:-5.2}
    container_name: nb-sql-client
    ports:
      - "${SQL_CLIENT_PORT:-8081}:80"
    environment:
      PMA_HOST: mysql-server
      PMA_USER: root
      PMA_PASSWORD: ${APPS_MYSQL_ROOT_PASSWORD:-rootpassword}
    depends_on:
      - mysql-server
    networks:
      - apps-network

  backend:
    build: ./backend
    image: nb-backend
    container_name: nb-backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    environment:
      MYSQL_HOST: mysql-server
      MYSQL_PORT: 3306
      # The backend's own MySQL login. Defaults to the same credential the
      # mysql-server container is created with (APPS_MYSQL_*), but has its own override
      # (BACKEND_MYSQL_*) so the Vault scenario can take the password out of
      # the backend's config entirely: `BACKEND_MYSQL_PASSWORD=` (set but
      # empty - note `-`, not `:-`, so empty is kept rather than replaced
      # by the default) leaves the backend unable to log in on its own, and
      # only a credential issued by Vault gets it in.
      MYSQL_USER: ${BACKEND_MYSQL_USER-${APPS_MYSQL_USER:-demo}}
      MYSQL_PASSWORD: ${BACKEND_MYSQL_PASSWORD-${APPS_MYSQL_PASSWORD:-demo}}
      MYSQL_DATABASE: ${APPS_MYSQL_DATABASE:-demo}
      PYTHONUNBUFFERED: 1
      # OpenTelemetry export - empty (the default) leaves it off. Set
      # OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318 in .env to
      # send traces/metrics to the observability module (needs
      # observability:up, and apps:restart to pick it up).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: nb-backend
      # Reported in every response's X-Served-By header - what tells the
      # instances apart when APPS_BACKEND_INSTANCES starts more of them.
      INSTANCE_ID: backend-1
      # Keycloak JWT validation (app/auth.py) - empty (the default) leaves
      # it off, only the mock /auth/login token is accepted. Set to
      # http://localhost:8180/realms/nasebanal in .env (needs `make
      # keycloak:up` + `apps:restart`) to also accept real Keycloak tokens
      # on the same protected routes - and the login page then offers a
      # "Keycloak" login (the frontend below reads the same variable). See
      # `make keycloak:verify-apps`. The issuer is the address the browser
      # logs in at; the backend fetches the signing keys from the
      # in-network address below instead.
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-http://keycloak:8080/realms/nasebanal/protocol/openid-connect/certs}
      # Vault-sourced MySQL credential (app/config.py) - empty (the
      # default) leaves it off, MYSQL_USER/MYSQL_PASSWORD above are used
      # as-is. Set both (needs `make vault:up`) to have the real backend
      # fetch secret/apps/mysql from Vault at startup instead - see `make
      # vault:verify-apps`, which sets these for one recreate without
      # touching .env.
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
    depends_on:
      - mysql-server
    networks:
      - apps-network

  frontend:
    build: ./frontend
    image: nb-frontend
    container_name: nb-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    environment:
      # URL called from the browser. The browser is outside the Docker
      # network, so this must be the host-published port, not the
      # container name (backend).
      # Overridable via .env - e.g. set to http://localhost:8000/api to
      # route every call through Kong's apps_backend route (see
      # kong/conf/declarative.yml) instead of hitting the backend
      # directly; needs `make kong:up` too, and a frontend recreate
      # (apps:restart) to pick up the new value, since Next.js dev mode
      # bakes NEXT_PUBLIC_* into the bundle at server start, not
      # per-request.
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8080}
      # Same idea, for kafka-bridge's health endpoint (make
      # kafka:bridge-up - see kafka/bridge/consumer.py's _HealthHandler)
      # instead of the main backend - kafka-bridge is a separate,
      # standalone container with its own host-published port, not
      # proxied through backend or Kong.
      NEXT_PUBLIC_KAFKA_BRIDGE_HEALTH_URL: ${NEXT_PUBLIC_KAFKA_BRIDGE_HEALTH_URL:-http://localhost:8090}
      # Keycloak login (LoginModal.tsx): the same KEYCLOAK_ISSUER the backend
      # validates against, and the browser talks to it directly - so it must
      # be the host-published address (http://localhost:8180/realms/...).
      # Empty (the default) hides the Keycloak option entirely.
      # The frontend *server*'s way to the backend, used when the browser goes
      # through it (NEXT_PUBLIC_API_BASE=/api/backend, see app/api/backend/): a
      # fixed address, or ask Consul for the healthy instances - switchable at
      # runtime from the accounts page. BACKEND_RESOLVER is the mode a fresh
      # server starts in.
      BACKEND_RESOLVER: ${BACKEND_RESOLVER:-direct}
      BACKEND_DIRECT_URL: ${BACKEND_DIRECT_URL:-http://backend:8080}
      CONSUL_HTTP_ADDR: ${CONSUL_HTTP_ADDR:-http://consul:8500}
      NEXT_PUBLIC_KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-}
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-apps-demo}
    depends_on:
      - backend
    networks:
      - apps-network

networks:
  # apps-network は compose ではなく `apps-network-ensure` (apps/Makefile) が
  # 冪等に作成する。apps/locust 等どちらが先に起動しても壊れないようにするため。
  apps-network:
    name: apps-network
    external: true

volumes:
  # Named (not anonymous) so `apps:down`/`apps:restart` can leave it alone -
  # data survives a normal restart, same as Kong's `kong-db-data` (same
  # "<module>-db-data" naming, for consistency between the two). Only
  # `apps:reset` removes it.
  apps-db-data:
  # Also named, not anonymous, and for the same reason - but here it's
  # about container *creation* speed, not data survival. An anonymous
  # volume isn't addressable, so it can't be reattached to a new container
  # object: every time the frontend container itself gets removed and
  # recreated (any apps:down -> apps:up, apps:restart, apps:reset - not
  # just a plain apps:up with nothing to rebuild), Docker has to allocate
  # a fresh one and populate it by copying the image's baked-in
  # node_modules (656-788MB) into it from scratch, before the container
  # can even start. Measured directly: an in-place --force-recreate (container
  # object kept, volume reference reused) took 3.2s; removing the
  # container first (matching what apps:down does) and recreating took
  # 26.5s, and a fresh, differently-named anonymous volume showed up each
  # time - confirmed via `docker inspect`. A named volume persists
  # independently of the container's lifecycle, so it survives exactly
  # the same `down`/`up` cycles apps-db-data already does, and gets reused
  # instead of rebuilt from scratch. apps:reset's `down --volumes` still
  # wipes this one too, so a real dependency change (package.json) is
  # never masked by a stale copy - same protection as before, just without
  # paying the copy cost on every ordinary restart.
  frontend-node-modules:
