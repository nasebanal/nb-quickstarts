name: CI

# This repository is a collection of docker-compose / Makefile / Python (locust) /
# shell script configuration files, so CI verifies that each artifact is not broken.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel the older run when a newer push arrives on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Syntax check of docker-compose definitions ----
  compose:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Copy the example so compose can resolve without a real .env
      - name: Prepare .env
        run: cp .env.example .env

      - name: Validate compose files
        run: |
          set -e
          for f in $(find . -name 'docker-compose*.yml' -not -path './.git/*'); do
            echo "::group::$f"
            docker compose -f "$f" --env-file .env config -q
            echo "::endgroup::"
          done

  # ---- Lint / syntax check of Python (locust) ----
  python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Pinned in requirements-dev.txt so an upstream ruff release cannot
      # change what CI enforces without a commit here (Renovate raises the
      # upgrade as a reviewable PR instead).
      - name: Install ruff
        run: pip install -r requirements-dev.txt

      - name: Syntax check (py_compile)
        run: python -m py_compile $(find . -name '*.py' -not -path './.git/*')

      - name: Ruff lint
        run: ruff check locust/bin apps/backend kafka/bridge

  # ---- Syntax check of shell scripts ----
  # Scripts use #!/bin/zsh (and the Makefiles set SHELL := /bin/zsh).
  # shellcheck does not support zsh, so use zsh's own syntax check (the correct interpreter).
  shell:
    name: Syntax check (zsh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: zsh -n
        run: |
          set -e
          for f in $(find . -name '*.sh' -not -path './.git/*'); do
            echo "checking $f"
            zsh -n "$f"
          done

  # ---- Type check of TypeScript (apps/frontend) ----
  typescript:
    name: Typecheck frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm install

      - name: tsc --noEmit
        working-directory: apps/frontend
        run: npm run typecheck

  # ---- Dockerfile lint and build check ----
  docker:
    name: Lint & build Dockerfile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dockerfile: locust/Dockerfile
            context: locust
            tag: nb-quickstarts/locust:ci
          - dockerfile: apps/backend/Dockerfile
            context: apps/backend
            tag: nb-quickstarts/apps-backend:ci
          - dockerfile: apps/frontend/Dockerfile
            context: apps/frontend
            tag: nb-quickstarts/apps-frontend:ci
          - dockerfile: kafka/bridge/Dockerfile
            context: kafka/bridge
            tag: nb-quickstarts/kafka-bridge:ci
    steps:
      - uses: actions/checkout@v4

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          # Do not fail on minor findings such as unpinned ARG versions
          failure-threshold: error

      - name: Build image
        run: docker build -t ${{ matrix.tag }} ${{ matrix.context }}
