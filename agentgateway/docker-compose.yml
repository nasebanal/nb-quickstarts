services:
  agentgateway:
    image: cr.agentgateway.dev/agentgateway:${AGENTGATEWAY_VERSION:-v1.5.0}
    container_name: nb-agentgateway
    volumes:
      - ./config.yaml:/config/config.yaml:ro
    command: ["-f", "/config/config.yaml"]
    ports:
      # Host-published port defaults to 8010, not agentgateway's own 3000
      # default - 3000 is a very common Node/React dev-server port on the
      # host, so defaulting to it here risks a collision (hit directly:
      # confirmed something else already listening on host :3000).
      # Container-internal port stays 3000, matching config.yaml's own
      # bind and agentgateway's own examples.
      - "${AGENTGATEWAY_PORT:-8010}:3000"
    networks:
      - apps-network

networks:
  # Owned by apps/docker-compose.yml; see AGENTS.md "Cross-module Docker network".
  apps-network:
    name: apps-network
    external: true
