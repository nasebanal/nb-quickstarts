# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# Exposes apps/backend's REST API as MCP tools, built straight from the
# OpenAPI contract (shared/openapi/openapi.yaml, mounted read-only at
# /shared) - the same file Specmatic, the backend and the frontend's
# /api-specs page use. `schema.file` reads it directly, so this gateway
# starts without apps/backend being up (only the tool *calls* need it).
#
# POST /transactions needs a real bearer token (issued by the login tool
# below), same as every other client of this API - the MCP tool for it
# works, but calling it without first calling login_auth_login_post and
# passing its token back as an Authorization header returns the same 401 a
# curl without one would.
#
# config.adminAddr defaults to loopback-only (127.0.0.1:15000 inside the
# container - see agentgateway's own config.rs), so it'd be unreachable
# from the host even with the port published; 0.0.0.0 makes it actually
# answer on the port docker-compose.yml publishes. Serves agentgateway's
# own dashboard UI at `/` (built into the image by default - see its
# Dockerfile's CARGO_FEATURES=agentgateway-app/ui) - `make
# agentgateway:open` opens it.
config:
  adminAddr: 0.0.0.0:15000
  # Exports a trace per request to the OTel Collector (`make observability:up`;
  # it shares apps-network). otlpProtocol http matches the Collector's 4318.
  # randomSampling defaults to false, i.e. nothing is exported at all unless
  # the incoming request already carries a trace; true samples every request
  # (fine for a demo, not for production).
  tracing:
    otlpEndpoint: http://otel-collector:4318
    otlpProtocol: http
    randomSampling: true
# Access logs (one record per request) exported over OTLP to the Collector,
# which forwards them to Loki - alongside the traces above.
frontendPolicies:
  accessLog:
    otlp:
      host: otel-collector:4318
      protocol: http
      path: /v1/logs
binds:
- port: 3000
  listeners:
  - routes:
    # /mcp itself, plus what an MCP client's browser login needs: the protected-resource metadata and the
    # authorization-server metadata / client registration that policies.mcpAuthentication (below) serves.
    - matches:
      - path:
          exact: /mcp
      - path:
          exact: /.well-known/oauth-protected-resource/mcp
      - path:
          exact: /.well-known/oauth-authorization-server/mcp
      - path:
          exact: /.well-known/oauth-authorization-server/mcp/client-registration
      backends:
      - mcp:
          targets:
          - name: apps-backend
            openapi:
              schema:
                file: /shared/openapi/openapi.yaml
              host: backend:8080
      policies:
        # Logging in: a request without a valid token gets 401 + WWW-Authenticate, which is what starts an MCP
        # client's browser login (Claude Code's Authenticate). The authorization server is the backend's own
        # OAuth login (apps/backend/app/mcp_oauth.py: /oauth/register, /oauth/authorize, /oauth/token, whose
        # login page is the frontend's /mcp-authorize), and the tokens it hands out are the backend's RS256 JWTs:
        # issuer and audience below are the claims of those tokens, and the signing keys are fetched from the
        # backend's JWKS over apps-network (the browser-facing issuer is localhost:8080, which the container
        # cannot reach, hence the separate jwks url). resource is the URL a client connects to (host port 8010).
        mcpAuthentication:
          mode: strict
          issuer: http://localhost:8080
          audiences:
          - nb-quickstarts-api
          jwks:
            url: http://backend:8080/.well-known/jwks.json
          resourceMetadata:
            resource: http://localhost:8010/mcp
            scopesSupported:
            - mcp
            bearerMethodsSupported:
            - header
        # Once a token has been validated above, agentgateway removes it from the request - so the tools' REST
        # calls to the backend would arrive without one and get its 401. passthrough sends the validated JWT on.
        backendAuth:
          passthrough: {}
        # Only needed for a browser-based MCP client (e.g. an inspector UI)
        # calling this cross-origin - mcp-session-id/mcp-protocol-version
        # are custom headers the MCP Streamable HTTP transport relies on,
        # hidden from JS by default under CORS unless exposed here (same
        # reasoning as apps/backend's own CORSMiddleware exposing `Via`
        # for the Kong status check - see apps/frontend/src/lib/api.ts).
        cors:
          allowOrigins:
          - "*"
          allowHeaders:
          - content-type
          - mcp-protocol-version
          - mcp-session-id
          exposeHeaders:
          - mcp-session-id
          - mcp-protocol-version
          maxAge: 5m
