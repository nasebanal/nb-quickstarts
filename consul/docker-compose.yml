services:
  consul:
    image: ${CONSUL_IMAGE:-hashicorp/consul}:${CONSUL_VERSION:-1.21.5}
    container_name: consul
    ports:
      - "${CONSUL_HTTP_PORT:-8500}:8500"
      - "${CONSUL_DNS_PORT:-8600}:8600"
      - "${CONSUL_SERVER_RPC_PORT:-8300}:8300"
    command: agent -server -ui -bootstrap-expect=1 -client=0.0.0.0
    environment:
      CONSUL_BIND_INTERFACE: ${CONSUL_BIND_INTERFACE:-eth0}
    networks:
      - consul-net
      # So `consul:register-apps`'s HTTP/TCP health checks (run by the
      # Consul agent itself, from inside this container) can resolve
      # "backend"/"frontend"/"mysql-server" by name - see AGENTS.md
      # "Cross-module Docker network".
      - apps-network
    volumes:
      - consul-data:/consul/data
      - consul-config:/consul/config
    healthcheck:
      test: ["CMD-SHELL", "consul members || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  consul-net:
    name: consul-net
  apps-network:
    name: apps-network
    external: true

volumes:
  consul-data:
  consul-config:
