_format_version: "3.0"
_transform: true

services:
  # httpbin-backed demo endpoints, showing Kong's own gateway features
  # (routing, rate-limiting) with no dependency on apps being up.
  - name: example_service
    url: https://httpbin.konghq.com
    routes:
      - name: example_mock_route
        paths:
          - /mock
      - name: example_echo_route
        paths:
          - /echo
        methods:
          - GET
          - POST
    plugins:
      - name: rate-limiting
        config:
          minute: 5
          policy: local

  # Proxies to the real apps backend (REST/GraphQL/MCP/OpenAPI - everything
  # under backend:8080's own root), strip_path so http://localhost:8000/api/transactions
  # reaches backend:8080/transactions. Requires `make apps:up` (or apps-network
  # won't resolve `backend` by name - Kong itself still starts fine
  # without it, this route just proxies a connection error until apps is
  # up). This is the seam a future Consumer-side E2E test could point at a
  # mock instead of the real backend (e.g. Specmatic's mock, see
  # specmatic:mock-up) without apps/frontend needing to know the
  # difference - just repoint this service's `url` and re-import.
  - name: apps_backend
    url: http://backend:8080
    routes:
      - name: apps_backend_route
        paths:
          - /api
        strip_path: true
    plugins:
      # apps/frontend's "Via Kong" indicator (see api.ts's checkViaKong())
      # detects Kong by reading the `Via` response header Kong itself
      # always adds - but browsers hide non-safelisted response headers
      # from JS unless Access-Control-Expose-Headers lists them. The real
      # backend's own CORSMiddleware already exposes it (see
      # apps/backend/app/main.py), but repointing this service's `url` at
      # a mock (e.g. Specmatic's mock) swaps in a server that doesn't know
      # to - so add it here, at the gateway, where it applies no matter
      # what's behind this service. `add` (not `append`) is a no-op when
      # the upstream already sets it, so this doesn't double it up against
      # the real backend. Same reasoning covers the "Via Mock" indicator
      # (checkViaMock()) and Specmatic's own `X-Specmatic-Result` header -
      # the real backend never sends that header at all, so exposing its
      # name is harmless there, and it's only ever actually present when
      # this service is pointed at Specmatic's mock.
      - name: response-transformer
        config:
          add:
            headers:
              - "Access-Control-Expose-Headers:Via,X-Specmatic-Result"
      # Off by default; switch it on when this service is pointed at Specmatic's mock (Scenario 2).
      # The whole API needs a bearer token now, and the mock only answers the one token its contract
      # examples carry (the fixed demo token) - not the token a login hands out. With this on, the
      # gateway swaps that token in for whatever the client sent, so the frontend (and curl) keep
      # working against the mock. `replace` only touches a request that already has an Authorization
      # header. Enable: curl -X PATCH localhost:8001/plugins/mock-demo-token -d enabled=true
      - name: request-transformer
        instance_name: mock-demo-token
        enabled: false
        config:
          replace:
            headers:
              - "Authorization:Bearer eyJhbGciOiJSUzI1NiIsImtpZCI6Im1YZmJOUEFmS0M0TUN1ZDAiLCJ0eXAiOiJKV1QifQ.eyJpc3MiOiJodHRwOi8vbG9jYWxob3N0OjgwODAiLCJzdWIiOiJkZW1vIiwicHJlZmVycmVkX3VzZXJuYW1lIjoiZGVtbyIsImF1ZCI6Im5iLXF1aWNrc3RhcnRzLWFwaSIsImlhdCI6MTc2NzIyNTYwMCwiZXhwIjo0MTAyNDQ0ODAwfQ.egX-L8FA_KK2GhL7Gsg2mYtsWDhmxDxCz6P1h7jUMSAu5xU2oTb5fbib4vBVpay-ExfdBbOvyJ2qDx3M2t2XdrqsdkyWo-GVZFgXCBLVjPY_8s8-CGaVSnhOJMJ2bZOsGHnMTd9ay5LrKw5hHTVAFK1V0Gf9Sk3eqQNIkk987IhEi6b7g2pWE8AS9BrVt9RbRSANo8I_iWVPHpQCF-KsTizgHciTuHvDS0viGa-w_4N8o3nXSMIeTxhuzVgOAJKfccDYhMpUZXc6m0Sco0sxNkGY-J-5p1FEAmEaZ5r_mqWvPKm3xXJ1cr1L5WiJrUY9GyFs2uN0P6T-Jn4ynBpA5Q"
      # Sends a trace of each request through the gateway to the OTel
      # Collector (`make observability:up`; it shares apps-network with Kong).
      # The plugin also needs KONG_TRACING_INSTRUMENTATIONS=request in
      # kong/docker-compose.yml. Without the Collector running, Kong just
      # logs that it could not export - requests are unaffected.
      - name: opentelemetry
        config:
          endpoint: http://otel-collector:4318/v1/traces
          resource_attributes:
            service.name: nb-kong

# You can add more services, routes, plugins here
# Example:
# - name: my_api
#   url: http://my-backend:8080
#   routes:
#     - name: my_route
#       paths:
#         - /my-api
