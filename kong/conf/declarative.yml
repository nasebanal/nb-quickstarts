_format_version: "3.0"
_transform: true

services:
  # httpbin-backed demo endpoints, showing Kong's own gateway features
  # (routing, rate-limiting) with no dependency on apps being up.
  - name: example_service
    url: https://httpbin.konghq.com
    routes:
      - name: example_mock_route
        paths:
          - /mock
      - name: example_echo_route
        paths:
          - /echo
        methods:
          - GET
          - POST
    plugins:
      - name: rate-limiting
        config:
          minute: 5
          policy: local

  # Proxies to the real apps backend (REST/GraphQL/MCP/OpenAPI - everything
  # under backend:8080's own root), strip_path so http://localhost:8000/api/accounts
  # reaches backend:8080/accounts. Requires `make apps:up` (or apps-network
  # won't resolve `backend` by name - Kong itself still starts fine
  # without it, this route just proxies a connection error until apps is
  # up). This is the seam a future Consumer-side E2E test could point at a
  # mock instead of the real backend (e.g. Specmatic's stub, see
  # specmatic:stub-up) without apps/frontend needing to know the
  # difference - just repoint this service's `url` and re-import.
  - name: apps_backend
    url: http://backend:8080
    routes:
      - name: apps_backend_route
        paths:
          - /api
        strip_path: true
    plugins:
      # apps/frontend's "Via Kong" indicator (see api.ts's checkViaKong())
      # detects Kong by reading the `Via` response header Kong itself
      # always adds - but browsers hide non-safelisted response headers
      # from JS unless Access-Control-Expose-Headers lists them. The real
      # backend's own CORSMiddleware already exposes it (see
      # apps/backend/app/main.py), but repointing this service's `url` at
      # a mock (e.g. Specmatic's stub) swaps in a server that doesn't know
      # to - so add it here, at the gateway, where it applies no matter
      # what's behind this service. `add` (not `append`) is a no-op when
      # the upstream already sets it, so this doesn't double it up against
      # the real backend.
      - name: response-transformer
        config:
          add:
            headers:
              - "Access-Control-Expose-Headers:Via"

# You can add more services, routes, plugins here
# Example:
# - name: my_api
#   url: http://my-backend:8080
#   routes:
#     - name: my_route
#       paths:
#         - /my-api
