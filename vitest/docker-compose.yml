services:
  vitest:
    build:
      context: ../apps/frontend
    image: nb-vitest
    volumes:
      - ../apps/frontend:/app
      - vitest-node-modules:/app/node_modules
      - ./report:/report
    working_dir: /app
    command: npm run test:report

  # Consumer-side contract test: runs only src/lib/contract/ against a
  # Specmatic stub (make specmatic:stub-up), not the real backend - see
  # that directory's api.consumer.test.ts for why. Needs apps-network to
  # reach the stub by its service name, unlike the `vitest` service above
  # (fetch entirely mocked, no network needed at all).
  vitest-contract:
    build:
      context: ../apps/frontend
    image: nb-vitest
    volumes:
      - ../apps/frontend:/app
      - vitest-node-modules:/app/node_modules
      - ./report-contract:/report
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_BASE: http://specmatic-stub:${SPECMATIC_STUB_PORT:-9091}
    command: npm run test:contract-report
    networks:
      - apps-network

networks:
  # Owned by apps/docker-compose.yml; see AGENTS.md "Cross-module Docker network".
  apps-network:
    name: apps-network
    external: true

volumes:
  # Named, not anonymous, and shared by both services above (same image,
  # same node_modules content) - see AGENTS.md "A bind-mounted service's
  # dependency directory needs its own volume" for why this matters more
  # here than almost anywhere else in the repo: `run --rm` always creates a
  # brand new container per invocation, so an anonymous volume would pay
  # the full node_modules copy cost (656-788MB) on *every single*
  # `vitest:test`/`vitest:contract-test` run, not just after a restart.
  # Measured before this fix: 41s wall time for a 213ms test.
  vitest-node-modules:
